name: Website-Funktionstest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lokale Funktions- und Strukturtests
        run: npm test

      - name: Bild und Film des Monats prüfen
        run: npm run test:month

      - name: Öffentliche Webseite und Cloudflare-API prüfen
        run: npm run test:live
